[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtcoach"
version = "2.0.0"
description = "La historia de un entrenador con cadenas de Markov (Hackathon ISAC 2026)"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.20",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6",
  "matplotlib>=3.9",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dtcoach = "dtcoach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: prueba integral del pipeline completo (pytest -m lento)"]
addopts = "-m 'not lento'"

[tool.ruff]
line-length = 110
